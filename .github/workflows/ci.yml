name: CI

# Self-check inventory for this repo (see sim/README.md, sim/harness/README.md,
# CLAUDE.md) and where each one runs:
#
#   - `package.json` `check:ci` (JSON syntax of sim/pdk.json and every
#     sim/**/testbench/tb.json manifest, shell/python syntax of the harness
#     scripts, `sim/tests/` unit coverage for sim/harness's own
#     PDK-resolution/corner-matrix/netlist-patch/record-provenance logic,
#     `layout/tests/` unit coverage for the trivial-cell LVS reference
#     netlists, the DRC negative-control fixture's injected violations, and
#     the layout record's own provenance logic, and `signoff/tests/` coverage
#     of `signoff/item6_preconditions.py` -- which re-derives which of T1 item
#     6's preconditions are outstanding and fails when the committed
#     `signoff/item6-preconditions.md` no longer matches the repo) ->
#     `checks` job below, every
#     push/PR. Headless, no PDK needed -- true on every host, not just this
#     CI runner: its final step is a plain `bash sim/selftest.sh` (no flags),
#     which only runs stage 1's PDK-free unit tests and exits; it never
#     resolves or simulates against a PDK even on a host that has one
#     installed (see sim/selftest.sh's own header). Simulating at all needs
#     the separate `--require-pdk` opt-in below (issue #183).
#   - `sim/run_corners.py pdk-smoke` (the harness's own liveness test: proves
#     the pinned sky130 PDK models load in ngspice, xschem netlists
#     headlessly, and the PVT knobs actually reach the simulator) via
#     `sim/selftest.sh --quick --require-pdk` -> requires xschem +
#     ngspice + `klt` (the harness netlists schematics via `klt netlist`,
#     never raw xschem) + the ~1 GB sky130 PDK via ciel, so per CLAUDE.md's
#     "headless only" CI guideline it does NOT block every PR. It runs in the
#     `pdk-smoke` job on a nightly schedule, on manual dispatch, and opt-in on
#     a PR carrying the `run-pdk-smoke` label -- which is evaluated on that
#     PR's next push or a manual `workflow_dispatch`, not at label-write time:
#     the `on:` block below deliberately omits the `labeled` type (issue #487),
#     because Loom drives this repo's PR lifecycle through label writes and
#     each would re-run every job on an unchanged head, burning hosted minutes
#     and racing post-verdict.sh's exact-head CI gate. The smoke runs WITHOUT
#     `--record`
#     (issue #526): recording mints an evidence record, which needs an
#     artifact broker (`KLT_ARTIFACT_BROKER`, fail-closed per DR-012 with no
#     fallback to committing the bytes) and CI has no broker -- evidence
#     minting stays a human/agent run, not a CI step (see the `sim/` bullet
#     below); the smoke still proves the toolchain works end to end, it just
#     does not persist a record.
#   - `layout/bin/run-trivial-cell-flow.sh` (the `klt` DRC/LVS flow's own
#     gating proof) needs the sky130 PDK too and is not yet wired into this
#     workflow -- run it by hand per layout/README.md; its checked-in
#     `layout/trivial-cell/reports/<record-id>/record.md` is the current
#     evidence.
#   - `signoff/run-signoff.sh --check` (this block's T1 tier verdict, re-rendered
#     from signoff/block-manifest.json and diffed against the committed
#     signoff/tier-report.json -- see signoff/README.md) -> `checks` job below,
#     every push/PR. Needs `klt` from PyPI but no PDK, no KLayout binary and no
#     layout input, so it stays headless like the rest of that job.
#   - Anything under `sim/<experiment>/records/` is evidence captured by a
#     human/agent run of the harness, not a repeatable CI check -- re-running
#     it here would mint a new append-only record on every push, which is not
#     what CI is for. See sim/README.md for how to reproduce a claim by hand.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  checks:
    name: Repo checks (headless, no PDK)
    # GitHub-hosted for every event (2AMLogic/2am#3182): this repo is public,
    # so hosted minutes are free, and the shared self-hosted runner is retired.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: npm run check:ci
        run: npm run check:ci

      - name: Install klt (klayout-tools) for the signoff tier check
        # Pinned, for the same reason sim/pdk.json pins the PDK below: an
        # unpinned klt would re-render signoff/tier-report.json differently the
        # day upstream changes the checklist or the report shape, failing a PR
        # that touched nothing related. Bump deliberately, re-render the report
        # (`bash signoff/run-signoff.sh`), and read the diff.
        #
        # This is the pip wheel of https://github.com/2AMLogic/klayout-tools.
        # The tier-report check below needs no PDK, no KLayout app binary and
        # no layout input -- it only reads committed JSON plus the checklist
        # bundled in the wheel. It is deliberately a *different* pin from
        # layout/requirements.txt's (the flow that produces evidence moves on
        # its own schedule from the grader that reads it); both versions are
        # recorded in the report.
        run: pip install 'klayout-tools==0.8.0' && klt --version

      - name: signoff/run-signoff.sh --check (T1 tier verdict vs. the committed report)
        # signoff/tier-report.json is this block's T1 verdict of record --
        # machine-rendered by `klt signoff --manifest`, never hand-maintained
        # (see signoff/README.md). Re-rendering it here is what stops it
        # rotting: an evidence artifact that changed after the manifest pinned
        # its content_hash, or a cited record superseded by a newer one,
        # re-grades differently, the committed report stops matching, and this
        # step fails instead of a stale green row surviving.
        run: bash signoff/run-signoff.sh --check

  pdk-smoke:
    name: PDK-gated harness smoke test (nightly / workflow_dispatch / 'run-pdk-smoke' label, effective on the next push)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-pdk-smoke'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ngspice + the xschem runtime libraries
        # ngspice stays on apt; its pin is separate work. xschem is NOT an apt
        # package here: the next step installs the fleet-pinned release asset
        # (the version every committed schematic records; noble's apt package
        # is older). That binary links a few system libraries, so this step
        # declares exactly its direct NEEDED entries (`objdump -p
        # /opt/eda/xschem/bin/xschem`, release 3.4.7-2am.1): libX11, libXpm,
        # libcairo, libtcl8.6 and libtk8.6 -- apt pulls the rest (libXft,
        # libXss, libxcb, ...) as their dependencies. The ubuntu-24.04 runner
        # image ships tcl/tk (package `tk`) but nothing that pulls libxpm4
        # (its published apt list, as of 2026-11-28); the #525 source build
        # never noticed because its -dev build dependencies brought them all
        # in. Ones already present are a no-op. Re-derive this list when
        # .github/xschem-pin.json changes.
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice libx11-6 libxpm4 libcairo2 libtcl8.6 libtk8.6

      - name: Install xschem (fleet-pinned release asset, sha256-verified)
        # .github/scripts/install-xschem.sh is a verbatim copy of
        # 2AMLogic/klayout-tools scripts/install-xschem.sh @ 646532a (issue
        # #613): it downloads the public release asset the pin names, checks
        # its sha256 BEFORE anything is unpacked, and unpacks at
        # /opt/eda/xschem -- the asset's compile-time prefix, which the tree
        # cannot be relocated from, so xschem finds its own devices/*.sym
        # without an --rcfile. XSCHEM_MANIFEST points at the vendored pin so
        # the digest is the one committed in this repo, not whatever the
        # fleet manifest on main says today.
        #
        # The script only PRINTS the PATH directory, on the install path and
        # on its already-installed early return alike, so the GITHUB_PATH line
        # is separate and unconditional (the #525 script's early return
        # skipped its own GITHUB_PATH write, leaving later steps without
        # xschem).
        env:
          XSCHEM_MANIFEST: ${{ github.workspace }}/.github/xschem-pin.json
        run: |
          .github/scripts/install-xschem.sh
          echo /opt/eda/xschem/bin >> "$GITHUB_PATH"

      - name: Install xschem again (already-installed branch, fresh GITHUB_PATH)
        # Guards the early-return path. This step starts by emptying
        # GITHUB_PATH, so the PATH line is shown to populate a fresh, empty
        # file when the script installs nothing -- and that the script took
        # the already-installed branch rather than reinstalling.
        env:
          XSCHEM_MANIFEST: ${{ github.workspace }}/.github/xschem-pin.json
        run: |
          : > "$GITHUB_PATH"
          out="$(.github/scripts/install-xschem.sh 2>&1)"
          printf '%s\n' "$out"
          grep -q 'already installed' <<<"$out"
          echo /opt/eda/xschem/bin >> "$GITHUB_PATH"
          grep -qx /opt/eda/xschem/bin "$GITHUB_PATH"
          echo "GITHUB_PATH: $(cat "$GITHUB_PATH")"

      - name: Install ciel
        run: pip install --user ciel==2.6.1

      - name: Fetch + enable pinned sky130 PDK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          commit="$(python3 -c "import json;print(json.load(open('sim/pdk.json'))['open_pdks_commit'])")"
          ciel enable --pdk-family sky130 -l sky130_fd_pr "$commit"

      - name: Install klt (klayout-tools) for the harness smoke run
        # sim/harness/runner.py netlists every testbench schematic via
        # `klt netlist` (the sanctioned headless entry; a raw `xschem` can
        # hang in the Tk event loop), so the smoke needs `klt` on PATH too
        # (issue #526): without it stage 3 dies with FileNotFoundError before
        # any simulation runs. Pinned for the same reason as the checks job's
        # install above, and deliberately its own literal rather than a read
        # of layout/requirements.txt: the sim harness moves on its own
        # schedule from the layout flow and the signoff grader (all three
        # pins happen to sit at 0.8.0 today).
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pip install --user 'klayout-tools==0.8.0' && klt --version

      - name: Verify xschem (pinned install on PATH, pinned tag, headless netlist)
        # Three checks, one per way a pinned-binary install goes wrong:
        #  1. `xschem` resolves to /opt/eda/xschem/bin/xschem -- the
        #     GITHUB_PATH line took effect and nothing else on the runner
        #     shadows it;
        #  2. the installed tree carries the pinned tag and digest. The
        #     installer writes .installed-version only after the digest check
        #     and the unpack, so the marker names the bytes that were
        #     verified. Both values are read from the vendored pin: this step
        #     carries no second copy of them;
        #  3. a headless `klt netlist` of a committed testbench succeeds --
        #     the sanctioned entry (a raw `xschem` can hang in the Tk event
        #     loop). sim/pdk-smoke's testbench instantiates xschem's stock
        #     devices/vsource.sym as well as a sky130_fd_pr symbol, so this
        #     fails unless the binary found its own symbol library at the
        #     compile-time prefix AND the PDK is enabled.
        # `xschem --version` exits non-zero even when it works: the verdict is
        # its banner, the same way a netlist is judged by its output file.
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          want="$(jq -er '.tools.xschem.tag' .github/xschem-pin.json)"
          sha="$(jq -er '.tools.xschem.sha256' .github/xschem-pin.json)"
          got="$(command -v xschem)"
          echo "xschem resolves to: $got"
          [ "$got" = /opt/eda/xschem/bin/xschem ]
          marker="$(cat /opt/eda/xschem/.installed-version)"
          echo "installed-version marker: $marker"
          [ "$marker" = "${want} ${sha}" ]
          ver="$(xschem --version 2>&1 || true)"
          printf '%s\n' "$ver"
          grep -Fx "XSCHEM V${want}" <<<"$ver"
          mkdir -p "$RUNNER_TEMP/xschem-verify"
          netlist="$RUNNER_TEMP/xschem-verify/tb_pdk_smoke.spice"
          klt netlist --rcfile sim/xschemrc -o "$netlist" \
            sim/pdk-smoke/testbench/tb_pdk_smoke.sch
          grep -q '^V1 ' "$netlist"
          grep -q 'sky130_fd_pr__res_generic_po' "$netlist"

      - name: Run sim/selftest.sh (quick PVT subset, PDK required)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash sim/selftest.sh --quick --require-pdk
