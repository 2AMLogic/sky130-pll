name: CI

# Self-check inventory for this repo (see sim/README.md, sim/harness/README.md,
# CLAUDE.md) and where each one runs:
#
#   - `package.json` `check:ci` (JSON syntax of sim/pdk.json and every
#     sim/**/testbench/tb.json manifest, shell/python syntax of the harness
#     scripts, `sim/tests/` unit coverage for sim/harness's own
#     PDK-resolution/corner-matrix/netlist-patch/record-provenance logic,
#     `layout/tests/` unit coverage for the trivial-cell LVS reference
#     netlists, the DRC negative-control fixture's injected violations, and
#     the layout record's own provenance logic, and `signoff/tests/` coverage
#     of `signoff/item6_preconditions.py` -- which re-derives which of T1 item
#     6's preconditions are outstanding and fails when the committed
#     `signoff/item6-preconditions.md` no longer matches the repo) ->
#     `checks` job below, every
#     push/PR. Headless, no PDK needed -- true on every host, not just this
#     CI runner: its final step is a plain `bash sim/selftest.sh` (no flags),
#     which only runs stage 1's PDK-free unit tests and exits; it never
#     resolves or simulates against a PDK even on a host that has one
#     installed (see sim/selftest.sh's own header). Simulating at all needs
#     the separate `--require-pdk` opt-in below (issue #183).
#   - `sim/run_corners.py pdk-smoke` (the harness's own liveness test: proves
#     the pinned sky130 PDK models load in ngspice, xschem netlists
#     headlessly, and the PVT knobs actually reach the simulator) via
#     `sim/selftest.sh --quick --record --require-pdk` -> requires xschem +
#     ngspice + the ~1 GB sky130 PDK via volare, so per CLAUDE.md's
#     "headless only" CI guideline it does NOT block every PR. It runs in the
#     `pdk-smoke` job on a nightly schedule, on manual dispatch, and opt-in on
#     a PR via the `run-pdk-smoke` label.
#   - `layout/bin/run-trivial-cell-flow.sh` (the `klt` DRC/LVS flow's own
#     gating proof) needs the sky130 PDK too and is not yet wired into this
#     workflow -- run it by hand per layout/README.md; its checked-in
#     `layout/trivial-cell/reports/<record-id>/record.md` is the current
#     evidence.
#   - `signoff/run-signoff.sh --check` (this block's T1 tier verdict, re-rendered
#     from signoff/block-manifest.json and diffed against the committed
#     signoff/tier-report.json -- see signoff/README.md) -> `checks` job below,
#     every push/PR. Needs `klt` from PyPI but no PDK, no KLayout binary and no
#     layout input, so it stays headless like the rest of that job.
#   - Anything under `sim/<experiment>/records/` is evidence captured by a
#     human/agent run of the harness, not a repeatable CI check -- re-running
#     it here would mint a new append-only record on every push, which is not
#     what CI is for. See sim/README.md for how to reproduce a claim by hand.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  checks:
    name: Repo checks (headless, no PDK)
    # Route to the shared self-hosted fleet runner (2am#29) for same-repo
    # events, falling back to ubuntu-latest for fork PRs — untrusted fork code
    # must never execute on a self-hosted runner. Mirrors the expression in
    # 2AMLogic/klayout-tools#1246.
    #
    # This is not a speed change: GitHub-hosted minutes are billed for PRIVATE
    # repos, and this org's Actions billing is currently blocked ("The job was
    # not started because recent account payments have failed…", see #51). Every
    # run in this repo has failed at startup since 2026-08-20 while public
    # sibling repos — billed differently — stayed green. Self-hosted minutes are
    # not billed, so this restores CI here independently of the billing fix.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","heavy"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: npm run check:ci
        run: npm run check:ci

      - name: Install klt (klayout-tools) for the signoff tier check
        # Pinned, for the same reason sim/pdk.json pins the PDK below: an
        # unpinned klt would re-render signoff/tier-report.json differently the
        # day upstream changes the checklist or the report shape, failing a PR
        # that touched nothing related. Bump deliberately, re-render the report
        # (`bash signoff/run-signoff.sh`), and read the diff.
        #
        # This is the pip wheel of https://github.com/2AMLogic/klayout-tools.
        # The tier-report check below needs no PDK, no KLayout app binary and
        # no layout input -- it only reads committed JSON plus the checklist
        # bundled in the wheel. It is deliberately a *different* pin from
        # layout/requirements.txt's (the flow that produces evidence moves on
        # its own schedule from the grader that reads it); both versions are
        # recorded in the report.
        run: pip install 'klayout-tools==0.6.0'

      - name: signoff/run-signoff.sh --check (T1 tier verdict vs. the committed report)
        # signoff/tier-report.json is this block's T1 verdict of record --
        # machine-rendered by `klt signoff --manifest`, never hand-maintained
        # (see signoff/README.md). Re-rendering it here is what stops it
        # rotting: an evidence artifact that changed after the manifest pinned
        # its content_hash, or a cited record superseded by a newer one,
        # re-grades differently, the committed report stops matching, and this
        # step fails instead of a stale green row surviving.
        run: bash signoff/run-signoff.sh --check

  pdk-smoke:
    name: PDK-gated harness smoke test (nightly / workflow_dispatch / 'run-pdk-smoke' label)
    # Route to the shared self-hosted fleet runner (2am#29) for same-repo
    # events, falling back to ubuntu-latest for fork PRs — untrusted fork code
    # must never execute on a self-hosted runner. Mirrors the `checks` job's
    # expression above; this job is PR-triggered too (via the 'run-pdk-smoke'
    # label), so the same fork-PR guard applies.
    #
    # This is not a speed change: GitHub-hosted minutes are billed for PRIVATE
    # repos, and this org's Actions billing is currently blocked ("The job was
    # not started because recent account payments have failed…", see #51). Every
    # run in this repo has failed at startup since 2026-08-20 while public
    # sibling repos — billed differently — stayed green. Self-hosted minutes are
    # not billed, so this restores CI here independently of the billing fix.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","heavy"]') || 'ubuntu-latest' }}
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-pdk-smoke'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ngspice + xschem
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice xschem

      - name: Install volare
        run: pip install --user volare

      - name: Fetch + enable pinned sky130 PDK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          commit="$(python3 -c "import json;print(json.load(open('sim/pdk.json'))['open_pdks_commit'])")"
          volare fetch --pdk sky130 "$commit"
          volare enable --pdk sky130 "$commit"

      - name: Run sim/selftest.sh (quick PVT subset, PDK required)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash sim/selftest.sh --quick --record --require-pdk
